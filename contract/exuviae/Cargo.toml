[package]
name = "shed-exuviae"
description = "SHED Exuviae: the burn collection. One permanent NFT per dethroned sculptor, minted by the main contract."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
repository = "https://github.com/STOOOKEEE/shed"

[lib]
# `cdylib` only when built standalone (the wasm contract); `rlib` as a dependency of `shed`.
# Both: cargo builds the cdylib here and links only the rlib into the main contract.
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"
shed-art = { path = "../art" }
near-gas = "0.3"
serde = { version = "1", default-features = false, features = ["derive"] }
borsh = { version = "1", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
